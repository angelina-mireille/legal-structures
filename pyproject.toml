[project]
name = "legal-structures"
version = "0.1.0"
description = "Prototype legal-reasoning tools: Perimeter and Downstream."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["core", "perimeter", "downstream"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
